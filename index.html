<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MiniGIS PRO - Operaciones Pucobre</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body, html { height: 100%; overflow: hidden; }

#app-container { display: flex; height: 100%; }

#sidebar {
    width: 320px;
    background: #2c3e50;
    color: #ecf0f1;
    padding: 20px;
    overflow-y: auto;
}

#map { flex-grow: 1; }

.section {
    margin-bottom: 20px;
    border-bottom: 1px solid #34495e;
    padding-bottom: 10px;
}

h3 {
    font-size: 0.8rem;
    color: #bdc3c7;
    margin-bottom: 8px;
}

select, input {
    width: 100%;
    padding: 5px;
    border-radius: 4px;
    border: none;
}

.nav-btn {
    width: 100%;
    margin-top: 5px;
    padding: 8px;
    background: #34495e;
    color: white;
    border: none;
    cursor: pointer;
}

.nav-btn:hover { background: #3498db; }

#info-panel {
    background: #1e272e;
    padding: 10px;
    border-radius: 4px;
    font-size: 0.85rem;
}

.legend-box {
    width: 12px;
    height: 12px;
    display: inline-block;
    margin-right: 5px;
}
</style>
</head>

<body>

<div id="app-container">

<div id="sidebar">

<h2>MiniGIS PRO</h2>

<div class="section">
<h3>Visualización</h3>
<label><input type="checkbox" id="togglePredios" checked> Predios 2026</label>
</div>

<div class="section">
<h3>Filtro Destino</h3>
<select id="filtroDestino">
<option value="">Todos</option>
<option value="INSTALACIONES MINA">Instalaciones</option>
<option value="AGRÍCOLA">Agrícola</option>
<option value="SIN USO">Sin uso</option>
</select>
</div>

<div class="section">
<h3>Buscar</h3>
<input type="text" id="buscador" placeholder="Propietario o texto...">
</div>

<div class="section">
<h3>Historial</h3>
<button class="nav-btn" onclick="navegarHistorial(-1)">◀ Atrás</button>
<button class="nav-btn" onclick="navegarHistorial(1)">Adelante ▶</button>
</div>

<div class="section">
<h3>Detalle</h3>
<div id="info-panel">Clic en un predio</div>
</div>

<div class="section">
<h3>Leyenda</h3>
<div><span class="legend-box" style="background:#e67e22"></span>Instalaciones</div>
<div><span class="legend-box" style="background:#27ae60"></span>Agrícola</div>
<div><span class="legend-box" style="background:#7f8c8d"></span>Sin uso</div>
</div>

</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([-27.361, -70.335], 13);

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

L.control.layers({"Calles": osm, "Satélite": sat}).addTo(map);

let capaPredios;
let historial = [];
let idx = -1;

function colorDestino(d){
    if (d === "INSTALACIONES MINA") return "#e67e22";
    if (d === "AGRÍCOLA") return "#27ae60";
    if (d === "SIN USO") return "#7f8c8d";
    return "#2ecc71";
}

function formatear(p){
    return `
    <b>Propietario:</b> ${p.PROPIET || '-'}<br>
    <b>Superficie:</b> ${p.SUPERF ? Number(p.SUPERF).toFixed(2)+' ha' : '-'}<br>
    <b>Destino:</b> ${p.DESTINO || '-'}<br>
    <b>Sector:</b> ${p.SECTOR || '-'}<br>
    <br>
    ${p.HV2 ? `<a href="${p.HV2ta</a>` : ''}
    `;
}

fetch('https://pub-b33115009b234c46b16cdb73cb03b40c.r2.dev/miniGIS/predios_2026_geojson.geojson')
.then(r=>r.json())
.then(data=>{

    capaPredios = L.geoJSON(data, {

        style:(f)=>({
            color: colorDestino(f.properties.DESTINO),
            fillColor: colorDestino(f.properties.DESTINO),
            weight: 2,
            fillOpacity: 0.4
        }),

        onEachFeature:(f,layer)=>{

            layer.bindTooltip(f.properties.PROPIET || "Predio");

            layer.on('mouseover', ()=> layer.setStyle({weight:4}));
            layer.on('mouseout', ()=> capaPredios.resetStyle(layer));

            layer.on('click', ()=>{
                guardar(layer.getBounds());
                map.fitBounds(layer.getBounds());
                document.getElementById('info-panel').innerHTML = formatear(f.properties);
            });
        }

    }).addTo(map);

    map.fitBounds(capaPredios.getBounds());
});

function guardar(b){
    historial = historial.slice(0, idx+1);
    historial.push(b);
    idx++;
}

function navegarHistorial(d){
    let n = idx + d;
    if(n>=0 && n<historial.length){
        idx = n;
        map.fitBounds(historial[idx]);
    }
}

document.getElementById('togglePredios').onchange = e=>{
    if(!capaPredios) return;
    e.target.checked ? map.addLayer(capaPredios) : map.removeLayer(capaPredios);
};

document.getElementById('filtroDestino').onchange = e=>{
    const val = e.target.value;
    capaPredios.eachLayer(l=>{
        const ok = !val || l.feature.properties.DESTINO === val;
        l.setStyle({fillOpacity: ok?0.4:0, opacity: ok?1:0});
    });
};

document.getElementById('buscador').onkeyup = e=>{
    const txt = e.target.value.toLowerCase();

    capaPredios.eachLayer(l=>{
        const props = l.feature.properties;
        const match =
            (props.PROPIET || '').toLowerCase().includes(txt) ||
            (props.DESTINO || '').toLowerCase().includes(txt);

        l.setStyle({fillOpacity: match?0.4:0, opacity: match?1:0});
    });
};

</script>

</body>
</html>
