<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniGIS - Operaciones Corporativas Pucobre</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body, html { height: 100%; overflow: hidden; }
        #app-container { display: flex; width: 100%; height: 100%; }
        #sidebar { width: 320px; background-color: #2c3e50; color: #ecf0f1; padding: 20px; z-index: 1000; box-shadow: 2px 0 5px rgba(0,0,0,0.2); }
        #map-container { flex-grow: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        h2 { font-size: 1.4rem; margin-bottom: 20px; border-bottom: 2px solid #34495e; padding-bottom: 10px; color: #3498db; }
        .section { margin-bottom: 25px; }
        .btn { display: block; width: 100%; background-color: #34495e; color: #ecf0f1; border: none; padding: 10px; margin-bottom: 8px; border-radius: 4px; cursor: pointer; text-align: left; }
        .btn:hover { background-color: #415b76; }
        .btn-action { background-color: #3498db; font-weight: bold; text-align: center; }
        #info-panel { background: #34495e; padding: 10px; border-radius: 4px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="sidebar">
            <h2>MiniGIS Operaciones</h2>
            <div class="section">
                <button class="btn btn-action" onclick="window.location.reload()">🔄 Recargar Capas</button>
            </div>
            <div class="section">
                <h3>Atributos del Predio</h3>
                <div id="info-panel">
                    <p style="font-style: italic; color: #a6b0b7;">Haga clic en un predio para ver información.</p>
                </div>
            </div>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Inicialización del mapa
        const map = L.map('map').setView([-27.361, -70.335], 13);

        const capaCalles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const capaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

        // URL desde tu R2 (Asegúrate de que la ruta final sea correcta)
        const urlGeoJSON = 'https://pub-b33115009b234c46b16cdb73cb03b40c.r2.dev/miniGIS/predios_2026_geojson.geojson';

        // Carga de la capa GeoJSON
        fetch(urlGeoJSON)
            .then(response => {
                if (!response.ok) throw new Error('No se pudo acceder al archivo en R2');
                return response.json();
            })
            .then(data => {
                const capaPredios = L.geoJSON(data, {
                    style: { color: "#2ecc71", fillColor: "#2ecc71", weight: 2, fillOpacity: 0.4 },
                    onEachFeature: (feature, layer) => {
                        layer.on('click', (e) => {
                            map.fitBounds(layer.getBounds(), { padding: [50, 50] });
                            document.getElementById('info-panel').innerHTML = `
                                <strong>${feature.properties.nombre || 'Sin Nombre'}</strong><br>
                                ID: ${feature.properties.id_predio || 'N/A'}<br>
                                Estado: ${feature.properties.estado || 'N/A'}<br>
                                Sup: ${feature.properties.superficie_ha || 0} Ha
                            `;
                        });
                    }
                }).addTo(map);
                
                // Zoom automático a la extensión de la capa
                map.fitBounds(capaPredios.getBounds());
            })
            .catch(err => {
                console.error('Error:', err);
                document.getElementById('info-panel').innerHTML = "<b>Error:</b> No se pudo cargar la capa. Verifica consola.";
            });

        // Controles de mapa
        L.control.layers({"Calles": capaCalles, "Satélite": capaSatelite}).addTo(map);
        L.control.scale().addTo(map);
    </script>
</body>
</html>
