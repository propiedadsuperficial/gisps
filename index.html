<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MiniGIS - Operaciones Pucobre</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body, html { height: 100%; overflow: hidden; }
        #app-container { display: flex; width: 100%; height: 100%; }
        #sidebar { width: 320px; background-color: #2c3e50; color: #ecf0f1; padding: 20px; z-index: 1000; box-shadow: 2px 0 5px rgba(0,0,0,0.2); }
        #map-container { flex-grow: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        .section { margin-bottom: 25px; border-bottom: 1px solid #34495e; padding-bottom: 15px; }
        h3 { font-size: 0.9rem; color: #bdc3c7; margin-bottom: 10px; text-transform: uppercase; }
        .control-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .nav-btn { background: #34495e; border: none; color: white; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; flex: 1; }
        .nav-btn:hover { background: #3498db; }
        #info-panel { background: #1e272e; padding: 10px; border-radius: 4px; font-size: 0.85rem; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="sidebar">
            <h2>MiniGIS Operaciones</h2>
            <div class="section">
                <h3>Visualización</h3>
                <label class="control-group">
                    <input type="checkbox" id="togglePredios" checked> Mostrar Predios 2026
                </label>
            </div>
            <div class="section">
                <h3>Historial de Zoom</h3>
                <div class="control-group">
                    <button class="nav-btn" onclick="navegarHistorial(-1)">◀ Atrás</button>
                    <button class="nav-btn" onclick="navegarHistorial(1)">Adelante ▶</button>
                </div>
            </div>
            <div class="section">
                <h3>Detalle</h3>
                <div id="info-panel">Haga clic en un predio.</div>
            </div>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([-27.361, -70.335], 13);
        
        // Capas Base
        const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
        
        // Selector de Capas Base
        L.control.layers({"Calles": streets, "Satélite": satellite}).addTo(map);

        let capaPredios;
        let historialZooms = [];
        let indiceActual = -1;

        // Carga de Capa
        fetch('https://pub-b33115009b234c46b16cdb73cb03b40c.r2.dev/miniGIS/predios_2026_geojson.geojson')
            .then(res => res.json())
            .then(data => {
                capaPredios = L.geoJSON(data, {
                    style: { color: "#2ecc71", fillColor: "#2ecc71", weight: 2, fillOpacity: 0.4 },
                    onEachFeature: (feature, layer) => {
                        layer.on('click', (e) => {
                            guardarVista(layer.getBounds());
                            map.fitBounds(layer.getBounds(), { padding: [50, 50] });
                            
                            let htmlInfo = `<strong>Información del Predio</strong><br><br>`;
                            for (let key in feature.properties) {
                                htmlInfo += `<b>${key}:</b> ${feature.properties[key]}<br>`;
                            }
                            document.getElementById('info-panel').innerHTML = htmlInfo;
                        });
                    }
                }).addTo(map);
                map.fitBounds(capaPredios.getBounds());
            });

        // Toggle ON/OFF
        document.getElementById('togglePredios').addEventListener('change', (e) => {
            if(capaPredios) {
                e.target.checked ? map.addLayer(capaPredios) : map.removeLayer(capaPredios);
            }
        });

        // Historial
        function guardarVista(bounds) {
            historialZooms = historialZooms.slice(0, indiceActual + 1);
            historialZooms.push(bounds);
            indiceActual++;
        }

        function navegarHistorial(dir) {
            let nuevoIndice = indiceActual + dir;
            if (nuevoIndice >= 0 && nuevoIndice < historialZooms.length) {
                indiceActual = nuevoIndice;
                map.fitBounds(historialZooms[indiceActual]);
            }
        }
    </script>
</body>
</html>
